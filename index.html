<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快艇骰子計分助理 (Yacht Dice Scorekeeper)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif; }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 p-2 rounded-xl text-white shadow-lg shadow-indigo-500/20">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-white">快艇骰子計分助理</h1>
                    <p class="text-xs text-slate-400">適用於實體骰子遊玩時的智慧計分與計算幫手</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <button onclick="resetGame()" class="px-3.5 py-2 text-xs font-medium text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 rounded-lg transition border border-slate-700">
                    重新開始遊戲
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-4 py-6 w-full flex-grow grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Left Column: Scorecard (Spans 8 cols) -->
        <div class="lg:col-span-8 flex flex-col gap-6">
            
            <!-- Player Bar & Round Indicator -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col sm:flex-row items-center justify-between gap-4 shadow-xl">
                <div class="flex items-center gap-3 w-full sm:w-auto">
                    <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">玩家列表:</span>
                    <div id="playerTabs" class="flex items-center gap-2 overflow-x-auto pb-1 sm:pb-0">
                        <!-- Populated by JS -->
                    </div>
                    <button onclick="addPlayer()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded-lg text-xs font-medium transition border border-slate-700 shrink-0">
                        + 新增玩家
                    </button>
                </div>

                <div class="flex items-center gap-4 text-xs font-medium text-slate-400">
                    <div class="bg-slate-950 px-3 py-1.5 rounded-lg border border-slate-800">
                        目前回合：<span id="currentRoundText" class="text-indigo-400 font-bold text-sm">1</span> / 13
                    </div>
                </div>
            </div>

            <!-- Scorecard Table -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl shadow-xl overflow-x-auto">
                <table class="w-full text-left border-collapse min-w-[500px]">
                    <thead>
                        <tr class="border-b border-slate-800 text-xs font-semibold text-slate-400 uppercase tracking-wider bg-slate-950/50">
                            <th class="py-3 px-4 w-2/5">計分項目</th>
                            <th id="tableHeaderPlayers" class="py-3 px-4 text-center">
                                <!-- Dynamic Player Columns -->
                            </th>
                        </tr>
                    </thead>
                    <tbody id="scoreTableBody" class="divide-y divide-slate-800/60 text-sm">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>

        </div>

        <!-- Right Column: Physical Dice Calculator Assistant (Spans 4 cols) -->
        <div class="lg:col-span-4 flex flex-col gap-6">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl sticky top-24 flex flex-col gap-5">
                <div>
                    <h2 class="text-base font-bold text-white flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                        </svg>
                        實體骰子計分計算器
                    </h2>
                    <p class="text-xs text-slate-400 mt-1">輸入你手上的 5 顆實體骰子點數，系統將自動計算出所有可填寫的對應分數！</p>
                </div>

                <!-- Dice Input Controls -->
                <div class="grid grid-cols-5 gap-2">
                    <div>
                        <label class="block text-[10px] text-slate-400 text-center mb-1">骰子 1</label>
                        <input type="number" min="1" max="6" value="1" id="dice-0" oninput="calculateSuggestions()" class="w-full bg-slate-950 border border-slate-800 rounded-xl text-center py-2 text-lg font-bold text-white focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-[10px] text-slate-400 text-center mb-1">骰子 2</label>
                        <input type="number" min="1" max="6" value="1" id="dice-1" oninput="calculateSuggestions()" class="w-full bg-slate-950 border border-slate-800 rounded-xl text-center py-2 text-lg font-bold text-white focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-[10px] text-slate-400 text-center mb-1">骰子 3</label>
                        <input type="number" min="1" max="6" value="1" id="dice-2" oninput="calculateSuggestions()" class="w-full bg-slate-950 border border-slate-800 rounded-xl text-center py-2 text-lg font-bold text-white focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-[10px] text-slate-400 text-center mb-1">骰子 4</label>
                        <input type="number" min="1" max="6" value="1" id="dice-3" oninput="calculateSuggestions()" class="w-full bg-slate-950 border border-slate-800 rounded-xl text-center py-2 text-lg font-bold text-white focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-[10px] text-slate-400 text-center mb-1">骰子 5</label>
                        <input type="number" min="1" max="6" value="1" id="dice-4" oninput="calculateSuggestions()" class="w-full bg-slate-950 border border-slate-800 rounded-xl text-center py-2 text-lg font-bold text-white focus:outline-none focus:border-indigo-500">
                    </div>
                </div>

                <div class="flex gap-2">
                    <button onclick="randomizeDice()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 py-2 rounded-xl text-xs font-semibold transition border border-slate-700">
                        隨機擲骰
                    </button>
                    <button onclick="clearDice()" class="px-4 bg-slate-800/50 hover:bg-slate-800 text-slate-400 hover:text-slate-200 py-2 rounded-xl text-xs font-semibold transition border border-slate-800">
                        重置
                    </button>
                </div>

                <!-- Suggestions List -->
                <div class="border-t border-slate-800 pt-4 flex flex-col gap-2">
                    <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">建議對應得分：</span>
                    <div id="suggestionsContainer" class="flex flex-col gap-2 max-h-[350px] overflow-y-auto pr-1">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800/80 bg-slate-900/40 py-4 text-center text-xs text-slate-500">
        快艇骰子計分助理 &copy; 2026 - 專為實體桌上遊戲設計
    </footer>

    <!-- JavaScript Game Logic -->
    <script>
        const categories = [
            { id: 'ones', name: '一 (Ones)', type: 'upper', desc: '所有 1 點總和' },
            { id: 'twos', name: '二 (Twos)', type: 'upper', desc: '所有 2 點總和' },
            { id: 'threes', name: '三 (Threes)', type: 'upper', desc: '所有 3 點總和' },
            { id: 'fours', name: '四 (Fours)', type: 'upper', desc: '所有 4 點總和' },
            { id: 'fives', name: '五 (Fives)', type: 'upper', desc: '所有 5 點總和' },
            { id: 'sixes', name: '六 (Sixes)', type: 'upper', desc: '所有 6 點總和' },
            { id: 'upperBonus', name: '上半區獎勵 (+35)', type: 'info', desc: '總和達 63 分以上解鎖' },
            { id: 'choice', name: '選擇 (Choice)', type: 'lower', desc: '5 顆骰子總和' },
            { id: 'threeOfAKind', name: '三條 (3 of a Kind)', type: 'lower', desc: '至少 3 顆相同，總和' },
            { id: 'fourOfAKind', name: '四條 (4 of a Kind)', type: 'lower', desc: '至少 4 顆相同，總和' },
            { id: 'fullHouse', name: '葫蘆 (Full House)', type: 'lower', desc: '3 顆同點 + 2 顆同點 (固定 25 分)' },
            { id: 'smallStraight', name: '小順 (Small Straight)', type: 'lower', desc: '4 顆連續數字 (固定 30 分)' },
            { id: 'largeStraight', name: '大順 (Large Straight)', type: 'lower', desc: '5 顆連續數字 (固定 40 分)' },
            { id: 'yacht', name: '快艇 (Yacht)', type: 'lower', desc: '5 顆點數完全相同 (固定 50 分)' },
            { id: 'total', name: '總分 (Total Score)', type: 'total', desc: '最終結算總分' }
        ];

        let gameState = {
            players: [
                { id: 1, name: '玩家 1', scores: {} },
                { id: 2, name: '玩家 2', scores: {} }
            ],
            activePlayerId: 1
        };

        function initGame() {
            const saved = localStorage.getItem('yacht_dice_state');
            if (saved) {
                try {
                    gameState = JSON.parse(saved);
                } catch (e) {
                    console.error(e);
                }
            }
            render();
            calculateSuggestions();
        }

        function saveGame() {
            localStorage.setItem('yacht_dice_state', JSON.stringify(gameState));
        }

        function resetGame() {
            if (confirm('確定要重新開始整場遊戲嗎？所有計分將會清除。')) {
                gameState.players.forEach(p => p.scores = {});
                saveGame();
                render();
                calculateSuggestions();
            }
        }

        function addPlayer() {
            if (gameState.players.length >= 4) {
                alert('最多支援 4 位玩家同樂！');
                return;
            }
            const newId = gameState.players.length > 0 ? Math.max(...gameState.players.map(p => p.id)) + 1 : 1;
            gameState.players.push({
                id: newId,
                name: `玩家 ${newId}`,
                scores: {}
            });
            saveGame();
            render();
        }

        function removePlayer(id) {
            if (gameState.players.length <= 1) {
                alert('至少需要保留一位玩家！');
                return;
            }
            if (confirm('確定要移除這位玩家嗎？')) {
                gameState.players = gameState.players.filter(p => p.id !== id);
                if (!gameState.players.some(p => p.id === gameState.activePlayerId)) {
                    gameState.activePlayerId = gameState.players[0].id;
                }
                saveGame();
                render();
            }
        }

        function updatePlayerName(id, newName) {
            const player = gameState.players.find(p => p.id === id);
            if (player) {
                player.name = newName;
                saveGame();
            }
        }

        function setScore(playerId, catId, value) {
            const player = gameState.players.find(p => p.id === playerId);
            if (!player) return;

            if (value === '' || value === null) {
                delete player.scores[catId];
            } else {
                player.scores[catId] = parseInt(value, 10);
            }
            saveGame();
            render();
        }

        // Calculate totals and bonus
        function calculateStats(player) {
            let upperSum = 0;
            const upperCategories = ['ones', 'twos', 'threes', 'fours', 'fives', 'sixes'];
            upperCategories.forEach(cat => {
                if (player.scores[cat] !== undefined) {
                    upperSum += player.scores[cat];
                }
            });

            let upperBonus = upperSum >= 63 ? 35 : 0;
            
            let lowerSum = 0;
            const lowerCategories = ['choice', 'threeOfAKind', 'fourOfAKind', 'fullHouse', 'smallStraight', 'largeStraight', 'yacht'];
            lowerCategories.forEach(cat => {
                if (player.scores[cat] !== undefined) {
                    lowerSum += player.scores[cat];
                }
            });

            let total = upperSum + upperBonus + lowerSum;
            let filledCount = Object.keys(player.scores).length;

            return { upperSum, upperBonus, lowerSum, total, filledCount };
        }

        function render() {
            // Render Player Tabs & Header
            const playerTabsEl = document.getElementById('playerTabs');
            playerTabsEl.innerHTML = '';

            gameState.players.forEach(p => {
                const stats = calculateStats(p);
                const isSelected = p.id === gameState.activePlayerId;
                const tab = document.createElement('div');
                tab.className = `flex items-center gap-2 px-3 py-1.5 rounded-xl border text-xs font-semibold transition ${isSelected ? 'bg-indigo-600/20 border-indigo-500/50 text-indigo-300' : 'bg-slate-950 border-slate-800 text-slate-300'}`;
                tab.innerHTML = `
                    <input type="text" value="${p.name}" onchange="updatePlayerName(${p.id}, this.value)" class="bg-transparent border-b border-transparent hover:border-slate-600 focus:border-indigo-400 focus:outline-none w-20 text-xs font-semibold text-white">
                    <span class="text-[10px] bg-slate-800 px-1.5 py-0.5 rounded text-slate-400">${stats.total}分</span>
                    ${gameState.players.length > 1 ? `<button onclick="removePlayer(${p.id})" class="text-slate-500 hover:text-rose-400">&times;</button>` : ''}
                `;
                playerTabsEl.appendChild(tab);
            });

            // Render Table Header
            const tableHeaderPlayers = document.getElementById('tableHeaderPlayers');
            tableHeaderPlayers.innerHTML = `<div class="grid grid-cols-${gameState.players.length} gap-2 text-center">` + 
                gameState.players.map(p => `<div>${p.name}</div>`).join('') + 
                `</div>`;

            // Render Table Body
            const tbody = document.getElementById('scoreTableBody');
            tbody.innerHTML = '';

            let maxFilled = 0;
            gameState.players.forEach(p => {
                const stats = calculateStats(p);
                if (stats.filledCount > maxFilled) maxFilled = stats.filledCount;
            });
            document.getElementById('currentRoundTextinnerText') || (document.getElementById('currentRoundText').innerText = Math.min(maxFilled + 1, 13));

            categories.forEach(cat => {
                const tr = document.createElement('tr');
                tr.className = cat.type === 'total' ? 'bg-indigo-950/20 font-bold text-white' : 'hover:bg-slate-800/30 transition';
                
                let html = `
                    <td class="py-3 px-4">
                        <div class="font-medium text-slate-200">${cat.name}</div>
                        <div class="text-[11px] text-slate-400">${cat.desc}</div>
                    </td>
                `;

                gameState.players.forEach(p => {
                    const stats = calculateStats(p);
                    if (cat.id === 'upperBonus') {
                        html += `
                            <td class="py-3 px-4 text-center">
                                <span class="px-2.5 py-1 rounded-lg text-xs font-bold ${stats.upperSum >= 63 ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-slate-800 text-slate-500'}">
                                    ${stats.upperBonus} 分 (${stats.upperSum}/63)
                                </span>
                            </td>
                        `;
                    } else if (cat.id === 'total') {
                        html += `
                            <td class="py-3 px-4 text-center font-extrabold text-indigo-400 text-base">
                                ${stats.total}
                            </td>
                        `;
                    } else {
                        const val = p.scores[cat.id] !== undefined ? p.scores[cat.id] : '';
                        html += `
                            <td class="py-3 px-4 text-center">
                                <input type="number" value="${val}" placeholder="-" 
                                    onchange="setScore(${p.id}, '${cat.id}', this.value)"
                                    class="w-16 bg-slate-950 border border-slate-800 focus:border-indigo-500 rounded-lg py-1.5 text-center text-sm font-bold text-white focus:outline-none">
                            </td>
                        `;
                    }
                });

                tr.innerHTML = html;
                tbody.appendChild(tr);
            });
        }

        // Dice Calculator Logic
        function getDiceValues() {
            let dice = [];
            for (let i = 0; i < 5; i++) {
                const val = parseInt(document.getElementById(`dice-${i}`).value, 10);
                dice.push(isNaN(val) ? 1 : val);
            }
            return dice;
        }

        function randomizeDice() {
            for (let i = 0; i < 5; i++) {
                const rand = Math.floor(Math.random() * 6) + 1;
                document.getElementById(`dice-${i}`).value = rand;
            }
            calculateSuggestions();
        }

        function clearDice() {
            for (let i = 0; i < 5; i++) {
                document.getElementById(`dice-${i}`).value = 1;
            }
            calculateSuggestions();
        }

        function calculateSuggestions() {
            const dice = getDiceValues();
            const counts = {};
            let sum = 0;
            dice.forEach(d => {
                counts[d] = (counts[d] || 0) + 1;
                sum += d;
            });

            const uniqueSorted = [...new Set(dice)].sort((a, b) => a - b);

            // Scoring rules evaluation
            const results = {
                ones: (counts[1] || 0) * 1,
                twos: (counts[2] || 0) * 2,
                threes: (counts[3] || 0) * 3,
                fours: (counts[4] || 0) * 4,
                fives: (counts[5] || 0) * 5,
                sixes: (counts[6] || 0) * 6,
                choice: sum,
                threeOfAKind: Object.values(counts).some(c => c >= 3) ? sum : 0,
                fourOfAKind: Object.values(counts).some(c => c >= 4) ? sum : 0,
                fullHouse: (Object.values(counts).includes(3) && Object.values(counts).includes(2)) || Object.values(counts).includes(5) ? 25 : 0,
                smallStraight: hasStraight(uniqueSorted, 4) ? 30 : 0,
                largeStraight: hasStraight(uniqueSorted, 5) ? 40 : 0,
                yacht: Object.values(counts).includes(5) ? 50 : 0
            };

            const container = document.getElementById('suggestionsContainer');
            container.innerHTML = '';

            const catMap = {
                ones: '一 (Ones)',
                twos: '二 (Twos)',
                threes: '三 (Threes)',
                fours: '四 (Fours)',
                fives: '五 (Fives)',
                sixes: '六 (Sixes)',
                choice: '選擇 (Choice)',
                threeOfAKind: '三條 (3 of a Kind)',
                fourOfAKind: '四條 (4 of a Kind)',
                fullHouse: '葫蘆 (Full House)',
                smallStraight: '小順 (Small Straight)',
                largeStraight: '大順 (Large Straight)',
                yacht: '快艇 (Yacht)'
            };

            for (const [key, score] of Object.entries(results)) {
                const item = document.createElement('div');
                item.className = `flex items-center justify-between p-2.5 rounded-xl border ${score > 0 ? 'bg-indigo-950/30 border-indigo-500/30 text-white' : 'bg-slate-950/50 border-slate-800/80 text-slate-400'}`;
                item.innerHTML = `
                    <span class="text-xs font-medium">${catMap[key]}</span>
                    <span class="text-xs font-bold ${score > 0 ? 'text-indigo-400' : 'text-slate-600'}">${score} 分</span>
                `;
                container.appendChild(item);
            }
        }

        function hasStraight(sortedUnique, length) {
            if (sortedUnique.length < length) return false;
            let streak = 1;
            for (let i = 0; i < sortedUnique.length - 1; i++) {
                if (sortedUnique[i + 1] === sortedUnique[i] + 1) {
                    streak++;
                    if (streak >= length) return true;
                } else if (sortedUnique[i + 1] !== sortedUnique[i]) {
                    streak = 1;
                }
            }
            return streak >= length;
        }

        // Initialize on load
        window.onload = initGame;
    </script>
</body>
</html>
